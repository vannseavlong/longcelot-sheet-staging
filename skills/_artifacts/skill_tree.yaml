package: longcelot-sheet-db
version: "0.1.15"

skill_tree:
  - name: core
    path: skills/core/SKILL.md
    description: >
      Package setup, SheetAdapter creation, schema registration, environment
      variables, onSchemaMismatch config, permissions matrix, asActor() helper,
      and integration with existing backends.
    covers:
      - createSheetAdapter / SheetAdapterConfig
      - registerSchema / registerSchemas
      - withContext (overview)
      - asActor()
      - createUserSheet
      - syncSchema
      - onSchemaMismatch config
      - permissions config (overview)
      - Environment variables
    depends_on: []

  - name: schema
    path: skills/schema/SKILL.md
    description: >
      Defining tables with defineTable() and fluent column builders.
      All column types and modifiers — including primary() PK auto-generation
      and ref() FK runtime enforcement.
    covers:
      - defineTable
      - string / number / boolean / date / json builders
      - All column modifiers
      - primary() — auto-generation, PK readonly enforcement
      - ref() — FK validation at runtime, skipFKValidation
      - Auto-generated columns
      - timestamps / softDelete options
      - actor field
    depends_on:
      - core

  - name: crud
    path: skills/crud/SKILL.md
    description: >
      Data access operations: create, createMany, findMany, findOne, count,
      update, upsert, delete. Actor isolation, filtering, pagination,
      serialization, and performance characteristics.
    covers:
      - withContext / UserContext
      - table()
      - create / CreateOptions
      - createMany (bulk insert)
      - findMany / FindOptions
      - findOne
      - count
      - update / UpdateOptions
      - upsert / UpsertOptions
      - delete / DeleteOptions
      - Soft delete behavior
      - Serialization rules
      - Performance characteristics
    depends_on:
      - core
      - schema

  - name: auth
    path: skills/auth/SKILL.md
    description: >
      Google OAuth2 flow — two managers: createOAuthManager (Sheets only) and
      createLoginOAuthManager (includes openid for user identity). bcrypt
      password utilities. For built-in Express routes see auth-router skill.
    covers:
      - createOAuthManager vs createLoginOAuthManager
      - OAuthConfig
      - getAuthUrl / getTokens / refreshTokens / verifyToken
      - When verifyToken() works (requires openid scope)
      - hashPassword / comparePassword / validatePasswordStrength
    depends_on:
      - core

  - name: auth-router
    path: skills/auth-router/SKILL.md
    description: >
      createAuthRouter — wires GET /auth/google and GET /auth/callback as
      Express middleware. Supports login-only and open-registration policies,
      multiple role endpoints, and HS256 JWT issuance.
    covers:
      - createAuthRouter / AuthRouterOptions
      - registrationPolicy ('open' | 'login-only')
      - GoogleProfile type
      - onUser callback
      - Multiple auth endpoints for different roles
      - JWT format and verification
      - createLoginOAuthManager for manual wiring
    depends_on:
      - core
      - auth

  - name: permissions
    path: skills/permissions/SKILL.md
    description: >
      Cross-actor CRUD: configure a permission matrix, use targetRole +
      targetSheetId in withContext(), use asActor() shorthand, and aggregate
      data across multiple user sheets.
    covers:
      - ActorPermission type
      - permissions map in SheetAdapterConfig
      - targetRole / targetSheetId in UserContext
      - asActor() shorthand
      - Full cross-actor CRUD (create, findMany, update, delete)
      - Admin bypass behavior
      - Fetching targetSheetId from admin users table
      - Aggregating data across multiple sheets
      - Permission enforcement error table
    depends_on:
      - core
      - crud

  - name: migrations
    path: skills/migrations/SKILL.md
    description: >
      Schema versioning (schema_versions table, onSchemaMismatch, computeSchemaHash),
      sync --all-users bulk push, lsdb export to Prisma/SQL, and
      lsdb migrate data migration script generation.
    covers:
      - schema_versions built-in table
      - computeSchemaHash utility
      - onSchemaMismatch ('warn' | 'error' | 'auto-sync')
      - SchemaMismatchError
      - sync --all-users / --dry-run
      - lsdb export --prisma / --sql
      - lsdb migrate script generation
      - Full migration path to production DB
      - What persists after migration (user_id vs actor_sheet_id)
    depends_on:
      - core
      - schema
      - cli

  - name: cli
    path: skills/cli/SKILL.md
    description: >
      The lsdb CLI: init, generate, sync (with --all-users, --dry-run,
      --token-file), validate, seed (with --skip-existing, --upsert, dynamic
      format), mock-users, doctor, status, export, migrate.
    covers:
      - lsdb init / --integrate
      - lsdb generate
      - lsdb sync / --all-users / --dry-run / --token-file
      - lsdb validate
      - lsdb seed / --skip-existing / --upsert / --all-actors
      - Dynamic seed file format (async function)
      - lsdb mock-users
      - lsdb doctor
      - lsdb status
      - lsdb export
      - lsdb migrate
      - lsdb.config.ts (ActorConfig shape)
      - .lsdb-tokens.json
    depends_on:
      - core
      - schema

package: longcelot-sheet-db
version: "0.1.15"
description: >
  A schema-first, actor-aware database adapter that uses Google Sheets
  as the storage engine. Designed for MVPs, prototypes, staging environments,
  and internal tools where zero infrastructure cost is a priority.

domains:
  - name: core
    description: >
      Package installation, SheetAdapter creation and configuration,
      OAuth token wiring, schema registration, onSchemaMismatch detection,
      cross-actor permissions matrix, asActor() helper, and integration with
      existing backends (Express, NestJS, etc.)
    sources:
      - README.md
      - src/adapter/sheetAdapter.ts
      - CLAUDE.md
    key_concepts:
      - createSheetAdapter
      - SheetAdapterConfig
      - registerSchema / registerSchemas
      - withContext / asActor
      - createUserSheet
      - syncSchema
      - onSchemaMismatch ('warn' | 'error' | 'auto-sync')
      - permissions (ActorPermission map)
      - Environment variables (GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_REDIRECT_URI, ADMIN_SHEET_ID)

  - name: schema
    description: >
      Table definition using defineTable() and the fluent column builder API.
      Covers column types (string, number, boolean, date, json), modifiers
      (required, unique, default, enum, pattern, min, max, ref, index, readonly,
      primary), auto-generated columns, timestamps, soft-delete, actor routing,
      primary key auto-generation (nanoid for string PKs), and FK runtime
      enforcement via ref().
    sources:
      - src/schema/defineTable.ts
      - src/schema/columnBuilder.ts
      - src/schema/types.ts
    key_concepts:
      - defineTable
      - ColumnBuilder (string, number, boolean, date, json)
      - Column modifiers
      - primary() — PK auto-generation for string columns; PK readonly on update
      - ref() — FK validation at runtime; skipFKValidation option
      - actor field
      - timestamps option
      - softDelete option
      - Auto-generated columns (_id, _created_at, _updated_at, _deleted_at)

  - name: crud
    description: >
      Data access operations: create, createMany (bulk insert), findMany,
      findOne, count, update, upsert (insert-or-update), delete.
      Covers the withContext() actor isolation pattern, in-memory filtering and
      sorting, unique constraint enforcement, soft delete behavior, serialization
      rules, and performance characteristics.
    sources:
      - src/adapter/crud.ts
      - src/adapter/sheetAdapter.ts
      - src/adapter/sheetClient.ts
    key_concepts:
      - withContext / UserContext
      - table()
      - create / CreateOptions
      - createMany — single API call batch insert
      - findMany / FindOptions
      - findOne
      - count
      - update / UpdateOptions
      - upsert / UpsertOptions
      - delete / DeleteOptions
      - Soft delete
      - Serialization (boolean as TRUE/FALSE, json as JSON string)
      - Permission enforcement via hasPermission()
      - Sheet routing via resolveSpreadsheetId()

  - name: auth
    description: >
      Google OAuth2 flow using OAuthManager. Two factory functions:
      createOAuthManager (Sheets scopes only) and createLoginOAuthManager
      (adds openid email profile for user identity + verifyToken() support).
      Also covers bcrypt-based password utilities.
    sources:
      - src/auth/oauth.ts
      - src/auth/password.ts
    key_concepts:
      - createOAuthManager / createLoginOAuthManager
      - OAuthManager / OAuthConfig
      - getAuthUrl (accepts optional scopes[])
      - getTokens / refreshTokens / verifyToken / getRedirectUri
      - verifyToken requires openid scope (use createLoginOAuthManager)
      - hashPassword / comparePassword / validatePasswordStrength

  - name: auth-router
    description: >
      createAuthRouter — Express-compatible middleware that wires GET /auth/google
      and GET /auth/callback routes. Supports login-only (no self-registration)
      and open (any Google user can register) policies. Issues HS256 JWTs using
      Node's built-in crypto. Supports multiple role-based endpoints via basePath.
    sources:
      - src/auth/router.ts
    key_concepts:
      - createAuthRouter / AuthRouterOptions
      - AuthRouter (handler, loginPath, callbackPath)
      - GoogleProfile type
      - registrationPolicy ('open' | 'login-only')
      - onUser callback
      - basePath for multiple auth endpoints
      - JWT issuance (HS256, no extra dependency)
      - createLoginOAuthManager used internally

  - name: permissions
    description: >
      Cross-actor CRUD: a teacher accessing a student's sheet, a parent reading
      a child's records, an admin auditing any user. Requires a permissions map
      in SheetAdapterConfig and targetRole + targetSheetId in UserContext.
      asActor() is a shorthand for switching target context.
    sources:
      - src/adapter/sheetAdapter.ts (hasPermission, resolveSpreadsheetId)
      - src/schema/types.ts (ActorPermission, UserContext)
    key_concepts:
      - ActorPermission (canAccess, tables)
      - targetRole / targetSheetId in UserContext
      - asActor() shorthand
      - Admin bypass (always allowed)
      - PermissionError scenarios
      - Fetching targetSheetId from admin users table
      - Aggregating data across multiple user sheets

  - name: migrations
    description: >
      Schema versioning, mismatch detection, and migration tooling.
      Covers the schema_versions admin table, computeSchemaHash utility,
      onSchemaMismatch runtime behavior, sync --all-users bulk push with
      exponential backoff, lsdb export (Prisma/SQL), and lsdb migrate
      script generation.
    sources:
      - src/utils/schemaHash.ts
      - src/cli/commands/sync.ts
      - src/cli/commands/export.ts
      - src/cli/commands/migrate.ts
      - src/errors/SchemaMismatchError.ts
    key_concepts:
      - schema_versions table (built-in admin table)
      - computeSchemaHash
      - SchemaMismatchError
      - onSchemaMismatch ('warn' | 'error' | 'auto-sync')
      - sync --all-users / --dry-run
      - Exponential backoff for rate limits
      - lsdb export --prisma / --sql
      - lsdb migrate script generation
      - Migration path: lsdb → Prisma/SQL

  - name: cli
    description: >
      The lsdb CLI binary. Covers all commands: init (--integrate),
      auth (--force, alias login), generate, sync (--all-users, --dry-run,
      --token-file for CI), validate, seed (--skip-existing, --upsert,
      --all-actors, dynamic function export), mock-users, doctor, status,
      export, migrate.
    sources:
      - src/cli/index.ts
      - src/cli/commands/init.ts
      - src/cli/commands/auth.ts
      - src/cli/commands/generate.ts
      - src/cli/commands/sync.ts
      - src/cli/commands/validate.ts
      - src/cli/commands/seed.ts
      - src/cli/commands/mock-users.ts
      - src/cli/commands/doctor.ts
      - src/cli/commands/status.ts
      - src/cli/commands/export.ts
      - src/cli/commands/migrate.ts
      - src/cli/lib/oauthFlow.ts
      - src/cli/lib/oauthCallbackServer.ts
      - src/cli/lib/browser.ts
    key_concepts:
      - lsdb init / --integrate
      - lsdb auth / --force (alias lsdb login)
      - Automatic OAuth redirect capture via local loopback server, falling back to manual code paste
      - lsdb generate
      - lsdb sync / --all-users / --dry-run / --token-file
      - lsdb validate
      - lsdb seed / --skip-existing / --upsert / --all-actors
      - Dynamic seed file (async function export)
      - lsdb mock-users
      - lsdb doctor
      - lsdb status
      - lsdb export --prisma / --sql
      - lsdb migrate
      - lsdb.config.ts (ActorConfig with sheetIdEnv)
      - .lsdb-tokens.json

implicit_knowledge:
  - OAuth is mandatory — there is no API-key-only mode
  - CommonJS only — chalk v4, inquirer v8, nanoid v3 (do NOT upgrade to ESM-only versions)
  - All reads load entire sheet into memory — not suitable for millions of rows
  - Each actor role owns one Google Spreadsheet; all tables for that actor are tabs within it
  - Admin actor always uses adminSheetId regardless of actorSheetId in context
  - dist/ is compiled output — not committed to git
  - createOAuthManager does NOT produce id_token — use createLoginOAuthManager for user identity
  - string primary() columns auto-generate nanoid; number primary() requires developer to supply value

failure_modes:
  - Missing registerSchema() before table() access
  - Expired OAuth tokens passed to createSheetAdapter
  - actor mismatch between withContext role and table's actor field
  - Duplicate table name within same actor
  - Manually defining auto-generated columns (_id, _created_at, etc.)
  - Upgrading chalk/inquirer/nanoid to ESM-only versions
  - Not running lsdb sync after schema changes
  - Committing .lsdb-tokens.json to version control
  - Using createOAuthManager for user login (verifyToken throws — needs openid scope)
  - Setting targetRole without targetSheetId in cross-actor context
  - Looping create() instead of createMany() for bulk inserts
